<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>功能7 · 干机循环</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="site-config.js"></script>
<style>
  :root {
    --green-deep:#0f3d24; --green-dark:#1b5e20; --green-mid:#2e7d32;
    --green:#43a047; --green-bright:#66bb6a; --green-light:#a5d6a7;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
    background:var(--green-deep);
    color:#fff;
    min-height:100vh;
  }
  .page {
    min-height:100vh;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(102,187,106,0.3), transparent 55%),
      radial-gradient(ellipse at 80% 100%, rgba(67,160,71,0.2), transparent 50%),
      linear-gradient(160deg, #1b5e20 0%, #0f3d24 60%, #082916 100%);
  }
  .container { max-width:720px; margin:0 auto; padding:24px 20px 60px; }
  .topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
  .back-btn {
    display:inline-flex; align-items:center; gap:6px;
    padding:8px 16px; background:rgba(255,255,255,0.08);
    border:1px solid rgba(165,214,167,0.3); border-radius:999px;
    color:#e8f5e9; text-decoration:none; font-size:14px; transition:background .2s;
  }
  .back-btn:hover { background:rgba(255,255,255,0.14); }
  .topbar h1 { font-size:20px; font-weight:700; letter-spacing:2px; }
  .topbar .spacer { width:80px; }

  .detail-card {
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(165,214,167,0.15);
    border-radius:20px;
    overflow:hidden;
    margin-bottom:20px;
    box-shadow:0 14px 40px rgba(0,0,0,0.3);
  }
  .img-box {
    width:100%;
    background:rgba(0,0,0,0.2);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:auto;
  }
  .img-box img {
    width:100%;
    height:auto;
    max-height:70vh;
    object-fit:contain;
    cursor:zoom-in;
    display:block;
  }
  /* 全屏大图预览 */
  .img-preview {
    position:fixed; inset:0;
    background:rgba(0,0,0,0.92);
    display:none;
    align-items:flex-start;
    justify-content:center;
    z-index:999;
    overflow:auto;
    padding:30px 16px;
  }
  .img-preview.show { display:flex; }
  .img-preview img {
    max-width:100%;
    height:auto;
    display:block;
    border-radius:8px;
    box-shadow:0 8px 40px rgba(0,0,0,0.5);
  }
  .img-preview .close-preview {
    position:fixed; top:16px; right:16px;
    width:40px; height:40px; border-radius:50%;
    background:rgba(255,255,255,0.15);
    border:none; color:#fff; font-size:20px;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    z-index:1000;
  }
  .img-preview .close-preview:hover { background:rgba(255,255,255,0.25); }
  .placeholder {
    text-align:center; color:rgba(200,230,201,0.4);
  }
  .placeholder .emoji { font-size:56px; display:block; margin-bottom:10px; }
  .placeholder .txt { font-size:14px; }
  .body { padding:20px; }
  .body h2 { font-size:22px; margin-bottom:10px; }
  .body p { font-size:14px; line-height:1.8; color:#c5e1a5; }
  .tag-list { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
  .tag {
    padding:4px 12px; background:rgba(102,187,106,0.15);
    border:1px solid rgba(102,187,106,0.3); border-radius:999px;
    font-size:12px; color:#a5d6a7;
  }
</style>
</head>
<body>
<div class="page">
  <div class="container">
    <div class="topbar">
      <a href="index.html" class="back-btn">‹ 返回首页</a>
      <h1>功能详情</h1>
      <div class="spacer"></div>
    </div>

    <div class="detail-card">
      <div class="img-box" id="imgBox">
        <div class="placeholder">
          <span class="emoji">🖼️</span>
          <span class="txt">暂无图片，请在后台上传替换</span>
        </div>
      </div>
      <div class="body">
        <h2>功能7</h2>
        <p id="descText">这里是功能7的详细介绍。你可以在后台管理页面上传图片来替换此处的占位图，也可以在此处编辑功能描述文字。</p>
        <div class="tag-list">
          <span class="tag">标签A</span>
          <span class="tag">标签B</span>
          <span class="tag">标签C</span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 全屏大图预览 -->
<div class="img-preview" id="imgPreview">
  <button class="close-preview" id="closePreview">✕</button>
  <img id="previewImg" alt="大图预览" />
</div>

<script>
  // 从 GitHub 仓库获取图片和描述（所有用户同步）
  fetch(window.SITE_CONFIG.cdnBase + '/config.json?t=' + Date.now()).then(r => r.json()).then(cfg => {
    const img = cfg['detail_long_7'];
    if (img) {
      document.getElementById('imgBox').innerHTML = '<img src="' + img + '" alt="功能7" id="detailImg">';
    }
    const desc = cfg['detail_desc_7'];
    if (desc) {
      document.getElementById('descText').textContent = desc;
    }
  }).catch(() => {});

  // 点击图片全屏放大预览
  const preview = document.getElementById('imgPreview');
  const previewImg = document.getElementById('previewImg');
  document.addEventListener('click', (e) => {
    if (e.target && e.target.id === 'detailImg') {
      previewImg.src = e.target.src;
      preview.classList.add('show');
    }
  });
  document.getElementById('closePreview').addEventListener('click', () => {
    preview.classList.remove('show');
  });
  preview.addEventListener('click', (e) => {
    if (e.target === preview) preview.classList.remove('show');
  });
</script>
</body>
</html>
